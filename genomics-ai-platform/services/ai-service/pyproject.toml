[project]
name = "genomics-ai-service"
version = "0.1.0"
description = "Pharmacogenomics ML, RAG and chat service for a national genomic dataset (reference implementation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
pg = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal fixtures are clearer on one line

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: File(...), Depends(...), Header(...)
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Header"]
